<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
  <title id="t">Adding the Due Process Complaint Drafter in the Claude desktop app</title>
  <desc id="d">In the Claude desktop app: open Customize, go to Plugins, click the plus button and choose Add marketplace, paste https://github.com/b33kman/special-education-due-process-complaint, then find Due Process Complaint Drafter and click Install.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#faf9f5" stroke="#e3e0d8"/>
  <text x="32" y="44" class="sans" font-size="15" font-weight="700" fill="#3d3929">In the Claude desktop app</text>

  <g class="sans">
    <!-- step 1 -->
    <circle cx="48" cy="92" r="16" fill="#d97757"/><text x="48" y="97.5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
    <text x="76" y="88" font-size="15" font-weight="700" fill="#3d3929">Open Customize</text>
    <text x="76" y="108" font-size="13" fill="#6b6758">in the left sidebar, then the Plugins tab</text>

    <!-- step 2 -->
    <circle cx="470" cy="92" r="16" fill="#d97757"/><text x="470" y="97.5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
    <text x="498" y="88" font-size="15" font-weight="700" fill="#3d3929">Click +  →  Add marketplace</text>
    <text x="498" y="108" font-size="13" fill="#6b6758">choose to add it from a repository</text>

    <!-- step 3 -->
    <circle cx="48" cy="168" r="16" fill="#d97757"/><text x="48" y="173.5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
    <text x="76" y="164" font-size="15" font-weight="700" fill="#3d3929">Paste this address</text>
  </g>
  <rect x="76" y="178" width="620" height="38" rx="8" fill="#fff" stroke="#cfcabd"/>
  <text x="92" y="202" class="mono" font-size="14.5" fill="#1f1e1a">https://github.com/b33kman/special-education-due-process-complaint</text>

  <g class="sans">
    <!-- step 4 -->
    <circle cx="48" cy="254" r="16" fill="#d97757"/><text x="48" y="259.5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
    <text x="76" y="250" font-size="15" font-weight="700" fill="#3d3929">Install “Due Process Complaint Drafter”</text>
    <text x="76" y="270" font-size="13" fill="#6b6758">find it in Browse plugins and click Install</text>
  </g>
</svg>
